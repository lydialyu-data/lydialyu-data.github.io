name: Build Resume PDFs

on:
  push:
    branches:
      - main
    paths:
      - "resume/**"
      - ".github/workflows/build-resume.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Build Chinese Resume
        run: |
          typst compile resume/cn/resume.typ resume/cn/Resume_CN.pdf

      - name: Build English Resume
        run: |
          typst compile resume/en/resume.typ resume/en/Resume_EN.pdf

      - name: Commit generated PDFs
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add resume/cn/Resume_CN.pdf
          git add resume/en/Resume_EN.pdf

          git commit -m "Auto build resume PDFs"
          git push
